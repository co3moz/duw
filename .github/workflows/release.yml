name: Release

# Pushing a v* tag builds every target and publishes them as a GitHub release
# that install.sh can pull from. The manual trigger is kept for reruns and for
# releasing a tag that already exists.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.1.0. Defaults to the ref this runs on."
        required: false
        type: string

permissions:
  contents: write

# Never let two runs publish the same release at once, and never cancel one
# halfway through: a partial release is worse than a slow one.
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # `inputs` is empty on a tag push, so this falls back to the tag name.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          # Native ARM runner, so no cross-compilation toolchain is needed.
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          # Both macOS targets build on the Apple silicon runner: the macOS SDK
          # is universal, so clang cross-compiles to x86_64 without any extra
          # toolchain. The old Intel runner (macos-13) has been retired.
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      # A tag that disagrees with Cargo.toml would ship binaries reporting the
      # wrong --version, so stop before building anything.
      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          have="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$TAG" != "$have" ]; then
            echo "tag $TAG does not match the version in Cargo.toml ($have)"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="duw-${{ matrix.target }}"
          mkdir -p "$name" dist
          cp README.md LICENSE "$name/"

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/duw.exe" "$name/"
            7z a -tzip "dist/$name.zip" "$name" > /dev/null
          else
            cp "target/${{ matrix.target }}/release/duw" "$name/"
            tar czf "dist/$name.tar.gz" "$name"
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect archives and checksum them
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} dist/ \;
          cd dist
          # install.sh verifies downloads against this file.
          sha256sum ./* > SHA256SUMS
          sed -i 's|\./||' SHA256SUMS
          cat SHA256SUMS

      # Reruns must not fail on an existing release, so an already published
      # tag gets its assets replaced instead.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists, replacing its assets"
            gh release upload "$TAG" dist/* --clobber
          else
            # --target pins the release to the commit that was built, which
            # matters when the tag does not exist yet on a manual run.
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --target "$GITHUB_SHA" \
              --generate-notes
          fi
