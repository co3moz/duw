name: Release

# Manual only: pick the tag, the workflow builds every target and publishes
# them as a GitHub release that install.sh can pull from.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.1.0 (must match the version in Cargo.toml)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          # Native ARM runner, so no cross-compilation toolchain is needed.
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          want='${{ inputs.tag }}'
          have="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$want" != "$have" ]; then
            echo "tag $want does not match the version in Cargo.toml ($have)"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="duw-${{ matrix.target }}"
          mkdir -p "$name" dist
          cp README.md LICENSE "$name/"

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/duw.exe" "$name/"
            7z a -tzip "dist/$name.zip" "$name" > /dev/null
          else
            cp "target/${{ matrix.target }}/release/duw" "$name/"
            tar czf "dist/$name.tar.gz" "$name"
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect archives and checksum them
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} dist/ \;
          cd dist
          # install.sh verifies downloads against this file.
          sha256sum ./* > SHA256SUMS
          sed -i 's|\./||' SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ inputs.tag }}' dist/* \
            --title '${{ inputs.tag }}' \
            --generate-notes
